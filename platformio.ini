; PlatformIO project for the panel firmware, all on the original ESP32
; (ESP32-DevKitC V4). The two Bluetooth environments share everything
; except the transport-specific entry point (see build_src_filter):
; esp32-classic speaks Bluetooth Classic SPP (the transport the Android app
; talks to out of the box), esp32-ble speaks BLE GATT. esp32-test-pattern
; is a Bluetooth-free wiring check, and native runs the protocol unit tests
; on the host.
[platformio]
; A bare `pio run` builds the verified firmware, not every env (native has
; no firmware to build).
default_envs = esp32-classic

[env]
; pioarduino rather than the stock espressif32 platform: stock is stuck on
; Arduino core 2.0.17, whose classic Bluetooth SDP responder a Pixel 9
; (Android 17) can't complete service discovery against - connections
; time out before reaching the firmware. Core 3.x works.
; Pinned (not "stable"): core 4.0 stops enabling BluetoothSerial by default.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
lib_deps =
	https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
; NO_GFX: the firmware only sets raw pixels, so the HUB75 library's
; optional Adafruit GFX base class (text, shapes) is dead weight.
build_flags =
	-std=gnu++17
	-Wall
	-DNO_GFX
build_unflags =
	-std=gnu++11

[env:esp32-classic]
board = esp32dev
build_src_filter = +<*> -<main_ble.cpp> -<main_test_pattern.cpp>

; BLE GATT instead of Classic SPP on the same board. The ESP32's radio does
; both, but each firmware uses only one: RAM is too tight for both stacks,
; and the Arduino core frees the unused one's controller memory at boot
; (btClassicInUse()/bleInUse() in esp32-hal-bt.c).
[env:esp32-ble]
board = esp32dev
build_src_filter = +<*> -<main_classic.cpp> -<main_test_pattern.cpp>

; Static diagnostic pattern (main_test_pattern.cpp) using the adapter's pin
; mapping (adapter_pins.h) and clkphase from panel.h: 1px white lines and
; border plus isolated R/G/B pixels, no Bluetooth involved. Use it first to
; confirm the wiring and signal timing; -DTEST_CLKPHASE=true to compare
; clock phases.
[env:esp32-test-pattern]
board = esp32dev
build_src_filter = +<*> -<main_classic.cpp> -<main_ble.cpp>

; Host-side unit tests for protocol.h (test/test_protocol) - no ESP32, no
; Arduino core: test/shim/Arduino.h stands in for the bits of the Arduino
; API protocol.h touches. Overrides the ESP32 platform/framework/lib_deps
; inherited from [env] so nothing hardware-specific gets pulled in.
;   pio test -e native
[env:native]
platform = native
framework =
lib_deps =
test_framework = unity
test_build_src = false
build_src_filter = -<*>
build_flags =
	-std=gnu++17
	-Wall
	-I test/shim
	-I src
